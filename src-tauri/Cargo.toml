[package]
name = "codex-voice-clipboard"
version = "0.1.0"
description = "Copies new Codex Desktop voice transcripts to the clipboard"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "codex_voice_clipboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# No network crates and no tauri-plugin-updater: the app never talks to the network
# (spec 1.7). `tests/no_network.rs` keeps it that way.
[dependencies]
cvc-core = { path = "../core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
dirs = "6"
dark-light = "2"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL"] }
objc2-service-management = { version = "0.3", features = ["SMAppService"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }

[dev-dependencies]
tempfile = "3"
