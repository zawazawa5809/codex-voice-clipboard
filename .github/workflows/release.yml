# On a version tag, builds both OSes, runs the same tests as CI, and attaches the
# installers to a draft Release. The owner reviews and publishes it by hand.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Tag matches the app version
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version $version"
            exit 1
          fi

  windows:
    needs: check-version
    uses: ./.github/workflows/windows.yml

  macos:
    needs: check-version
    uses: ./.github/workflows/macos.yml

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist

      # Space-free names, and checksums so downloads can be verified.
      - name: Collect assets
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir assets
          one() { [ $# -eq 1 ] && [ -f "$1" ] || { echo "::error::expected exactly one file, got: $*" >&2; exit 1; }; echo "$1"; }
          exe=$(one dist/nsis-installer/*.exe)
          dmg=$(one dist/macos-dmg/*.dmg)
          cp "$exe" "assets/CodexVoiceClipboard_${version}_windows_x64-setup.exe"
          cp "$dmg" "assets/CodexVoiceClipboard_${version}_macos_arm64.dmg"
          (cd assets && sha256sum * > SHA256SUMS.txt)

      # The tests (cargo test --workspace, tests/integration.py, codesign --verify) ran in
      # the windows and macos jobs above; this job only runs when they passed.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" assets/* --repo "$GITHUB_REPOSITORY" --draft --generate-notes --title "$GITHUB_REF_NAME"
